name: Sync upstream repository

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out IMIC-en
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Merge updates from imicjs.github.io
        env:
          UPSTREAM_REPOSITORY: imicjs/imicjs.github.io
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "IMIC-en is already up to date."
            exit 0
          fi

          git merge --no-edit upstream/main
          git push origin HEAD:main
